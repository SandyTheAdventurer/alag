<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALAG</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb; --panel: #f4f3f0; --line: #e3e2dd; --grid: #ecebe7;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #6f6e69; --accent: #2a78d6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface: #1a1a19; --panel: #222221; --line: #363633; --grid: #2c2c2a;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #9c9b92; --accent: #3987e5;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: grid; grid-template-columns: 280px minmax(0, 1fr);
  background: var(--surface); color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, input, select { font: inherit; color: inherit; }
#panel {
  display: flex; flex-direction: column; height: 100vh; min-height: 0;
  background: var(--panel); border-right: 1px solid var(--line);
}
#panel header { padding: 14px 14px 10px; }
#panel h1 { margin: 0 0 10px; font-size: 16px; letter-spacing: .04em; }
#exported { margin: -6px 0 10px; font-size: 12px; color: var(--text-2); }
#filter {
  width: 100%; padding: 6px 8px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--surface);
}
#tree { flex: 1; overflow-y: auto; padding: 0 6px 12px; }
.group { margin-top: 6px; }
.row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; padding: 4px 8px;
  border-radius: 6px; cursor: pointer; min-width: 0;
}
.row:hover { background: var(--line); }
.row input { margin: 0; flex: none; accent-color: var(--accent); }
.row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.group > .row { font-weight: 600; }
.group > .row .count { color: var(--text-3); font-weight: 400; font-size: 12px; }
.exp { margin-left: 14px; }
.key { flex: none; width: 16px; height: 0; border-top: 2px solid transparent; }
.live {
  flex: none; font-size: 11px; color: var(--text-2);
  border: 1px solid var(--line); border-radius: 4px; padding: 0 4px;
}
#main { height: 100vh; overflow-y: auto; min-width: 0; }
#bar {
  position: sticky; top: 0; z-index: 2; background: var(--surface);
  border-bottom: 1px solid var(--line); padding: 8px 16px;
}
#controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
#tabs { display: flex; flex-wrap: wrap; gap: 2px; }
#tabs button {
  border: 0; background: none; padding: 5px 10px; border-radius: 6px;
  cursor: pointer; color: var(--text-2);
}
#tabs button[aria-selected="true"] { background: var(--panel); color: var(--text); font-weight: 600; }
.control { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; }
.control input[type=range] { width: 100px; accent-color: var(--accent); }
.control select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }
#reset { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 2px 8px; cursor: pointer; color: var(--text-2); font-size: 13px; }
#legend { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 6px; font-size: 13px; color: var(--text-2); }
#legend:empty { display: none; }
#legend span { display: inline-flex; align-items: center; gap: 6px; }
#content { padding: 12px 16px 40px; }
.empty { color: var(--text-2); padding: 48px 8px; text-align: center; }
h2 { font-size: 13px; color: var(--text-2); margin: 18px 0 8px; font-weight: 600; }
h2:first-child { margin-top: 4px; }
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
.chart { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 4px; min-width: 0; }
.charthead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; margin-bottom: 4px; }
.chart h3 { margin: 0; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.tools { display: flex; gap: 2px; }
.tool, .link { border: 0; background: none; cursor: pointer; color: var(--text-2); font-size: 12px; padding: 1px 5px; border-radius: 4px; }
.tool:hover, .link:hover { background: var(--panel); color: var(--text); }
.flagform { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 6px 0; font-size: 12px; color: var(--text-2); }
.flagform[hidden] { display: none; }
.flagform select, .flagform input { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 1px 4px; font-size: 12px; }
.flagform input { width: 76px; }
.flagform input.sectionname { width: 160px; }
.flagform button[type=submit] { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; font-size: 12px; cursor: pointer; padding: 1px 8px; }
.hint { color: var(--text-3); flex-basis: 100%; }
.flaglist:not(:empty) { border-top: 1px solid var(--line); margin-top: 4px; padding: 4px 0; font-size: 12px; }
.flaghead { display: flex; justify-content: space-between; align-items: baseline; }
.flaghead strong { font-weight: 600; }
.flagitem { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
.flagitem .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flagitem .verdict { margin-left: auto; white-space: nowrap; color: var(--text); }
.flagitem.pending .verdict { color: var(--text-2); }
.flagitem.met .verdict { font-weight: 600; }
.tags { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 3px; padding-left: 21px; }
.tag { font-size: 11px; line-height: 1.3; color: var(--text-2); border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 0 4px; }
.notecard { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; max-width: 760px; }
.notecard h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.notecard label { display: block; color: var(--text-2); font-size: 12px; margin-top: 6px; }
.notecard input, .notecard textarea { display: block; width: 100%; margin-top: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
.notecard textarea { min-height: 70px; resize: vertical; }
.notecard .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 8px; font-size: 12px; color: var(--text-2); }
.notecard .actions button { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 2px 8px; cursor: pointer; color: var(--text-2); font-size: 12px; }
.notecard .actions button:disabled { cursor: default; opacity: .6; }
.notecard .actions button.armed { border-color: var(--s8); color: var(--text); font-weight: 600; }
#latex { width: min(760px, calc(100vw - 32px)); background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
#latex::backdrop { background: #0006; }
#latex h2 { margin: 0 0 4px; color: var(--text); font-size: 14px; }
#latex p { margin: 0 0 8px; color: var(--text-2); font-size: 13px; }
#latexcode { width: 100%; height: 320px; resize: vertical; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
#latexactions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
#latexactions button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
#copied { color: var(--text-2); font-size: 13px; }
.chart canvas { display: block; width: 100%; height: 230px; cursor: crosshair; touch-action: none; }
#tip {
  position: fixed; z-index: 5; display: none; pointer-events: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 4px 16px #0003; padding: 6px 10px; font-size: 12px; max-width: 340px;
}
#tip .head { color: var(--text-2); margin-bottom: 3px; }
#tip .tiprow { display: flex; align-items: center; gap: 8px; }
#tip strong { font-variant-numeric: tabular-nums; min-width: 64px; }
#tip .label { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.imagehead { display: flex; align-items: baseline; gap: 8px; }
.images { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-width: 0; }
figure img { display: block; width: 100%; height: auto; border-radius: 4px; background: #fff; }
figcaption { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); margin-bottom: 6px; overflow-wrap: anywhere; }
.scrub { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: var(--text-2); font-size: 13px; }
.scrub input { flex: 1; max-width: 420px; accent-color: var(--accent); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 5px 14px 5px 0; text-align: left; white-space: nowrap; }
th { font-weight: 600; color: var(--text-2); }
td.num { font-variant-numeric: tabular-nums; }
.hyperhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; margin-bottom: 8px; }
.hyperhead h2 { margin: 4px 0; }
.hyper th:first-child, .hyper td:first-child { position: sticky; left: 0; background: var(--surface); }
.hyper .key { display: inline-block; vertical-align: middle; margin-right: 8px; }
.hyper td.num { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.sort { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 400; color: var(--text-2); }
.sort:hover { color: var(--text); }
th.varies .sort { font-weight: 600; color: var(--text); }
@media (max-width: 760px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 38vh minmax(0, 1fr); height: 100vh; }
  #panel, #main { height: auto; }
  #panel { border-right: 0; border-bottom: 1px solid var(--line); }
  .charts { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<aside id="panel">
  <header>
    <h1>ALAG</h1>
    <p id="exported" hidden></p>
    <input id="filter" type="search" placeholder="Filter experiments" aria-label="Filter experiments">
  </header>
  <div id="tree"></div>
</aside>
<main id="main">
  <div id="bar">
    <div id="controls">
      <div id="tabs" role="tablist">
        <button role="tab" data-tab="charts" aria-selected="true">Charts</button>
        <button role="tab" data-tab="images" aria-selected="false">Images</button>
        <button role="tab" data-tab="table" aria-selected="false">Table</button>
        <button role="tab" data-tab="hyper" aria-selected="false">Hyperparameters</button>
        <button role="tab" data-tab="notes" aria-selected="false">Notes</button>
      </div>
      <label class="control">Smoothing <input id="smooth" type="range" min="0" max="0.99" step="0.01" value="0"><span id="smoothval">0</span></label>
      <label class="control">X axis <select id="xaxis"><option value="step">Step</option><option value="time">Time</option></select></label>
      <label class="control"><input id="logy" type="checkbox"> Log Y</label>
      <label class="control" title="Merges selected experiments in a group whose config differs only by seed"><input id="aggregate" type="checkbox"> Mean ± std over seeds</label>
      <button id="reset" hidden>Reset zoom</button>
    </div>
    <div id="legend"></div>
  </div>
  <div id="content"></div>
</main>
<div id="tip"></div>
<datalist id="sections"></datalist>
<dialog id="latex" aria-labelledby="latextitle">
  <h2 id="latextitle">LaTeX figure</h2>
  <p>Paste this into your document. The data is included, so there's no file to upload.</p>
  <textarea id="latexcode" readonly spellcheck="false" aria-label="LaTeX code"></textarea>
  <div id="latexactions">
    <button id="copy">Copy</button>
    <button id="closelatex">Close</button>
    <span id="copied" role="status"></span>
  </div>
</dialog>
<script>
"use strict";
const POLL_MS = 2000;
const LIVE_SECONDS = 15;
const SLOTS = 8;
const EXPORT = window.ALAG_EXPORT ?? null;   // set in a file made by `alag --export`
const DASHES = [[], [7, 4], [2, 3]];   // past 8 experiments, hues repeat with a new dash
const $ = id => document.getElementById(id);
const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};
const load = (key, fallback) => {
  if (EXPORT) return fallback;   // every exported file shares one origin, so storage would mix them
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
};
const save = (key, value) => {
  if (EXPORT) return;
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
};

const state = {
  tree: { root: "", groups: [] },
  selected: new Map(load("alag.selected", []).map(([id, slot]) => [id, slot])),
  hadSaved: load("alag.selected", null) !== null,
  collapsed: new Set(load("alag.collapsed", [])),
  tab: "charts", filter: "", smooth: 0, xaxis: "step", logy: false,
  zoom: null, imageStep: null, aggregate: false,
  hyperDiffOnly: load("alag.hyperDiffOnly", false), hyperSort: null,
  version: 0,            // bumped whenever what the charts show changes
  meta: new Map(),       // experiment id -> {note, tags}
  flags: new Map(),      // group name -> [flag]
  layouts: new Map(),    // group name -> {sections: {metric: name}, pinned: [name]}
};
const experiments = new Map();   // id -> loaded data
const charts = new Map();        // metric -> {canvas, ...}
const idOf = (g, e) => g + "/" + e;
const parseJSON = (text, fallback) => {
  try { return text ? JSON.parse(text) : fallback; } catch { return fallback; }
};
// Answers the page's requests from the data inside an exported file.
function exportFetch(url) {
  const { pathname, searchParams } = new URL(url, "http://alag");
  const saved = EXPORT.experiments[idOf(searchParams.get("g"), searchParams.get("e"))];
  const body = pathname === "/api/tree" ? JSON.stringify(EXPORT.tree)
    : pathname === "/api/config" ? saved.config
    : pathname === "/api/images" ? JSON.stringify(saved.images)
    : searchParams.get("offset") === "0" ? saved.metrics : "";
  return Promise.resolve(new Response(body));
}
const request = EXPORT ? exportFetch : url => fetch(url);
const post = (path, data) => fetch(path, {
  method: "POST",
  headers: { "Content-Type": "application/json", "X-Alag-Write": "1" },
  body: JSON.stringify(data),
});

function experiment(g, e) {
  const id = idOf(g, e);
  if (!experiments.has(id)) {
    experiments.set(id, { id, g, e, offset: 0, series: new Map(), start: null, config: null, images: [], size: 0 });
  }
  return experiments.get(id);
}

/* ---------- colours ---------- */
let palette = [];
let ink = {};
function readTheme() {
  const css = getComputedStyle(document.documentElement);
  palette = Array.from({ length: SLOTS }, (_, i) => css.getPropertyValue("--s" + (i + 1)).trim());
  for (const name of ["surface", "line", "grid", "text", "text-2", "text-3"]) ink[name] = css.getPropertyValue("--" + name).trim();
}
const colorOf = slot => palette[slot % SLOTS];
const screenTheme = () => ({ ...ink, series: palette });
const dashOf = slot => DASHES[Math.floor(slot / SLOTS) % DASHES.length];
function lineKey(slot) {
  const key = el("i", "key");
  key.style.borderTopColor = colorOf(slot);
  key.style.borderTopStyle = dashOf(slot).length ? "dashed" : "solid";
  return key;
}
function freeSlot() {
  const used = new Set(state.selected.values());
  let slot = 0;
  while (used.has(slot)) slot++;
  return slot;
}

/* ---------- selection ---------- */
function setSelected(id, on) {
  if (on && !state.selected.has(id)) state.selected.set(id, freeSlot());
  if (!on) state.selected.delete(id);
  state.version++;
  save("alag.selected", [...state.selected]);
}
function selectedExperiments() {
  const list = [];
  for (const group of state.tree.groups) {
    for (const item of group.experiments) {
      const id = idOf(group.name, item.name);
      if (state.selected.has(id)) list.push({ exp: experiment(group.name, item.name), slot: state.selected.get(id) });
    }
  }
  return list.sort((a, b) => a.slot - b.slot);
}
const labelOf = exp => {
  const clash = state.tree.groups.filter(g => g.experiments.some(e => e.name === exp.e)).length > 1;
  return clash ? exp.id : exp.e;
};

// What the charts plot: one line per experiment, or per set of seeds when merged.
const SEED_KEY = /(^|[._-])seed$/i;
function seedlessConfig(exp) {
  const flat = flatten(exp.config ?? {}, "", {});
  const keys = Object.keys(flat).sort();
  if (!keys.some(key => SEED_KEY.test(key))) return exp.id;   // nothing says these are seeds
  return exp.g + "\n" + JSON.stringify(keys.filter(key => !SEED_KEY.test(key)).map(key => [key, flat[key]]));
}
function sharedName(names) {
  let prefix = names[0];
  for (const name of names) while (!name.startsWith(prefix)) prefix = prefix.slice(0, -1);
  return prefix.replace(/[-_.= ]*(seed|s)?[-_.= ]*$/i, "") || names[0];
}
let itemsCache = null;
function displayItems() {
  if (itemsCache && itemsCache.version === state.version) return itemsCache.list;
  const buckets = new Map();
  for (const { exp, slot } of selectedExperiments()) {
    const key = state.aggregate ? seedlessConfig(exp) : exp.id;
    if (!buckets.has(key)) buckets.set(key, { id: key, group: exp.g, slot, members: [] });
    buckets.get(key).members.push(exp);
  }
  const list = [...buckets.values()];
  for (const item of list) {
    const { members } = item;
    item.label = members.length > 1 ? sharedName(members.map(exp => exp.e)) + " (" + members.length + " seeds)" : labelOf(members[0]);
  }
  itemsCache = { version: state.version, list };
  return list;
}

/* ---------- left panel ---------- */
function renderTree() {
  const tree = $("tree");
  const scroll = tree.scrollTop;
  tree.replaceChildren();
  const needle = state.filter.toLowerCase();
  if (!state.tree.groups.length) {
    tree.append(el("div", "empty", "No experiments in " + state.tree.root));
    return;
  }
  for (const group of state.tree.groups) {
    const shown = group.experiments.filter(e => {
      const meta = state.meta.get(idOf(group.name, e.name)) ?? {};
      return [group.name, e.name, meta.note ?? "", ...(meta.tags ?? [])].join("\n").toLowerCase().includes(needle);
    });
    if (!shown.length) continue;
    const box = el("div", "group");
    const ids = shown.map(e => idOf(group.name, e.name));
    const on = ids.filter(id => state.selected.has(id)).length;

    const head = el("label", "row");
    const all = el("input");
    all.type = "checkbox";
    all.checked = on === ids.length;
    all.indeterminate = on > 0 && on < ids.length;
    all.setAttribute("aria-label", "Select all in " + group.name);
    all.onchange = () => { ids.forEach(id => setSelected(id, all.checked)); refresh(); };
    const name = el("span", "name", group.name);
    name.title = group.name;
    const fold = state.collapsed.has(group.name);
    const count = el("span", "count", (fold ? "▸ " : "▾ ") + group.experiments.length);
    count.onclick = event => {
      event.preventDefault();
      fold ? state.collapsed.delete(group.name) : state.collapsed.add(group.name);
      save("alag.collapsed", [...state.collapsed]);
      renderTree();
    };
    head.append(all, name, count);
    box.append(head);

    if (!fold || needle) {
      for (const item of shown) {
        const id = idOf(group.name, item.name);
        const row = el("label", "row exp");
        const check = el("input");
        check.type = "checkbox";
        check.checked = state.selected.has(id);
        check.onchange = () => { setSelected(id, check.checked); refresh(); };
        const label = el("span", "name", item.name);
        const meta = state.meta.get(id) ?? {};
        label.title = meta.note ? item.name + "\n\n" + meta.note : item.name;
        row.append(check, label);
        if (!EXPORT && item.age < LIVE_SECONDS) row.append(el("span", "live", "live"));
        if (state.selected.has(id)) row.append(lineKey(state.selected.get(id)));
        if (meta.tags?.length) {
          const tags = el("span", "tags");
          for (const tag of meta.tags) tags.append(el("span", "tag", tag));
          row.append(tags);
        }
        box.append(row);
      }
    }
    tree.append(box);
  }
  tree.scrollTop = scroll;
}

function renderLegend() {
  const legend = $("legend");
  legend.replaceChildren();
  const list = displayItems();
  if (list.length < 2 && !state.aggregate) return;
  for (const { label, slot } of list) {
    const item = el("span");
    item.append(lineKey(slot), document.createTextNode(label));
    legend.append(item);
  }
}

/* ---------- data ---------- */
function parseLine(line) {
  if (!line.includes('"')) return line.split(",");
  const out = [];
  let field = "", quoted = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quoted) {
      if (c !== '"') field += c;
      else if (line[i + 1] === '"') { field += '"'; i++; }
      else quoted = false;
    } else if (c === '"') quoted = true;
    else if (c === ",") { out.push(field); field = ""; }
    else field += c;
  }
  out.push(field);
  return out;
}
function addRows(exp, text) {
  for (const line of text.split("\n")) {
    if (!line || line.startsWith("step,time,")) continue;
    const [step, time, metric, value] = parseLine(line);
    const t = +time;
    if (exp.start === null) exp.start = t;
    let series = exp.series.get(metric);
    if (!series) exp.series.set(metric, series = { step: [], time: [], y: [] });
    series.step.push(+step);
    series.time.push(t - exp.start);
    series.y.push(parseFloat(value));   // "nan" and "inf" become gaps in the line
  }
  state.version++;
}

const PAPER = {
  surface: "#ffffff", grid: "#e6e5e1", line: "#8f8e88", text: "#0b0b0b", "text-2": "#3f3e3b", "text-3": "#52514e",
  series: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"],
};
const paperScene = chart => buildScene(chart.metric, seriesFor(chart.metric), flagsFor(chart.metric), {
  W: 640, H: 420, theme: PAPER, font: "Arial, Helvetica, sans-serif", size: 12, title: true, legend: true,
});
const fileStem = metric => metric.replace(/[^\w.-]+/g, "-").replace(/^-+|-+$/g, "") || "chart";
function download(blob, name) {

}
const xml = text => String(text).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const round2 = v => Math.round(v * 100) / 100;
function toSVG(scene) {
  const { W, H, plot } = scene;
  const out = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Arial, Helvetica, sans-serif">`,
    `<defs><clipPath id="plot"><rect x="${plot.l}" y="${plot.t}" width="${plot.r - plot.l}" height="${plot.b - plot.t}"/></clipPath></defs>`,
    `<rect width="${W}" height="${H}" fill="${PAPER.surface}"/>`];
  for (const p of scene.prims) {
    const clip = p.clip ? ' clip-path="url(#plot)"' : "";
    if (p.k === "text") {
      out.push(`<text x="${round2(p.x)}" y="${round2(p.y)}" font-size="${p.size}" fill="${p.color}" text-anchor="${p.anchor}"${clip}>${xml(p.text)}</text>`);
      continue;
    }
    const points = p.pts.map(([x, y]) => round2(x) + "," + round2(y)).join(" ");
    if (p.k === "poly") out.push(`<polygon points="${points}" fill="${p.color}" fill-opacity="${p.alpha}"${clip}/>`);
    else {
      const dash = p.dash.length ? ` stroke-dasharray="${p.dash.join(" ")}"` : "";
      out.push(`<polyline points="${points}" fill="none" stroke="${p.color}" stroke-width="${p.width}" stroke-opacity="${p.alpha}" stroke-linejoin="round"${dash}${clip}/>`);
    }
  }
  out.push("</svg>");
  return out.join("\n");
}
// A small vector PDF writer, so pdflatex can include charts without a library.
function toPDF(scene) {
  const { W, H, plot } = scene;
  const rgb = hex => [1, 3, 5].map(i => (parseInt(hex.slice(i, i + 2), 16) / 255).toFixed(3)).join(" ");
  const n = v => round2(v);
  const flip = y => n(H - y);
  const alphas = new Map();
  const gs = alpha => {
    if (!alphas.has(alpha)) alphas.set(alpha, "G" + alphas.size);
    return "/" + alphas.get(alpha) + " gs";
  };
  const pdfText = text => [...text].map(c => {
    const code = c.charCodeAt(0);
    if (c === "(" || c === ")" || c === "\\") return "\\" + c;
    return code >= 32 && code <= 255 ? c : "?";   // the built-in font is Latin-1 only
  }).join("");
  const body = [`${rgb(PAPER.surface)} rg 0 0 ${W} ${H} re f`];
  let clipped = false;
  for (const p of scene.prims) {
    if (!!p.clip !== clipped) {
      clipped = !clipped;
      body.push(clipped ? `q ${n(plot.l)} ${flip(plot.b)} ${n(plot.r - plot.l)} ${n(plot.b - plot.t)} re W n` : "Q");
    }
    if (p.k === "text") {
      const width = textWidth(p.text, p.size, scene.font);
      const shift = p.anchor === "end" ? width : p.anchor === "middle" ? width / 2 : 0;
      body.push(`${rgb(p.color)} rg BT /F1 ${p.size} Tf ${n(p.x - shift)} ${flip(p.y)} Td (${pdfText(p.text)}) Tj ET`);
      continue;
    }
    const path = p.pts.map(([x, y], i) => `${n(x)} ${flip(y)} ${i ? "l" : "m"}`).join(" ");
    if (p.k === "poly") body.push(`q ${gs(p.alpha)} ${rgb(p.color)} rg ${path} h f Q`);
    else body.push(`q ${gs(p.alpha)} ${rgb(p.color)} RG ${p.width} w 1 j [${p.dash.join(" ")}] 0 d ${path} S Q`);
  }
  if (clipped) body.push("Q");
  const stream = body.join("\n");
  const states = [...alphas].map(([alpha, name]) => `/${name} << /CA ${alpha} /ca ${alpha} >>`).join(" ");
  const objects = [
    "<< /Type /Catalog /Pages 2 0 R >>",
    "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> /ExtGState << ${states} >> >> >>`,
    `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
  ];
  let file = "%PDF-1.4\n";
  const offsets = objects.map((object, i) => {
    const at = file.length;
    file += `${i + 1} 0 obj\n${object}\nendobj\n`;
    return at;
  });
  const start = file.length;
  file += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
  for (const at of offsets) file += String(at).padStart(10, "0") + " 00000 n \n";
  file += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF\n`;
  return Uint8Array.from(file, c => c.charCodeAt(0));
}
function toCSV(chart) {
  const quote = v => /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const aggregated = seriesFor(chart.metric).some(s => s.std);
  const rows = [aggregated ? "experiment,step,mean,std,seeds" : "experiment,step,value"];
  for (const s of seriesFor(chart.metric)) {
    for (let i = 0; i < s.ys.length; i++) {
      const cells = [quote(s.label), s.steps[i], s.ys[i]];
      if (aggregated) cells.push(s.std ? s.std[i] : 0, s.n ? s.n[i] : 1);
      rows.push(cells.join(","));
    }

  return rows.join("\n") + "\n";
}
const latexEscape = text => String(text).replace(/[\\{}$&#%_^~]/g, c => ({
  "\\": "\\textbackslash{}", "^": "\\textasciicircum{}", "~": "\\textasciitilde{}",

// A pgfplots figure with its data inline, so it needs no extra file. Points are
// thinned because pdflatex runs out of memory on long coordinate lists.
function toLatex(chart) {
  const LATEX_COLUMNS = 150;
  const list = seriesFor(chart.metric);
  const flags = flagsFor(chart.metric);
  const { x0, x1, usable } = plotRange(list, flags);
  const num = v => Number(v.toPrecision(6));
  const coords = pts => pts.map(([x, y]) => `(${num(x)},${y === null ? "nan" : num(y)})`).join(" ");
  const out = [
    "% Needs in your preamble: \\usepackage{pgfplots} \\pgfplotsset{compat=1.18}",
    "\\begin{figure}[t]",
    "  \\centering",
  ];
  const used = [...new Set(list.map(s => s.slot % SLOTS))];
  for (const slot of used) out.push(`  \\definecolor{alag${slot + 1}}{HTML}{${PAPER.series[slot].slice(1).toUpperCase()}}`);
  out.push("  \\begin{tikzpicture}", "    \\begin{axis}[");
  const options = [
    "width=\\linewidth", "height=0.62\\linewidth",
    `xlabel={${state.xaxis === "time" ? "Time (s)" : "Step"}}`, `ylabel={${latexEscape(chart.metric)}}`,
    "grid=major", "grid style={gray!20}", "unbounded coords=jump", "no markers",
    "legend style={at={(0.5,1.03)},anchor=south,legend columns=-1,draw=none,font=\\footnotesize,/tikz/every even column/.append style={column sep=6pt}}",
  ];
  if (state.logy) options.push("ymode=log");
  if (state.zoom) options.push(`xmin=${num(x0)}`, `xmax=${num(x1)}`);
  out.push(options.map(option => "      " + option).join(",\n"), "    ]");
  for (const s of list) {
    const color = "alag" + (s.slot % SLOTS + 1);
    const shown = pick(s.xs, s.ys, x0, x1, LATEX_COLUMNS, usable);
    if (s.lo) {
      const kept = shown.filter(i => i >= 0 && usable(s.lo[i]));
      const band = kept.map(i => [s.xs[i], s.hi[i]]).concat(kept.slice().reverse().map(i => [s.xs[i], s.lo[i]]));
      out.push(`    \\addplot[draw=none, fill=${color}, fill opacity=0.18, forget plot] coordinates {${coords(band)}};`);
    }
    const dash = [", ", ", densely dashed", ", densely dotted"][Math.floor(s.slot / SLOTS) % 3].replace(/^, $/, "");
    const pts = shown.map(i => i < 0 ? [s.xs[0], null] : [s.xs[i], s.ys[i]]);
    out.push(`    \\addplot[${color}, thick${dash}] coordinates {${coords(pts)}};`);
    if (list.length > 1) out.push(`    \\addlegendentry{${latexEscape(s.label)}}`);
  }
  for (const flag of flags) {
    if (state.xaxis !== "step" || !usable(flag.value)) continue;
    out.push(`    \\addplot[black, densely dashed, forget plot] coordinates {(${num(x0)},${num(flag.value)}) (${num(flag.step)},${num(flag.value)})};`);
    out.push(`    \\node[font=\\scriptsize, anchor=south west] at (axis cs:${num(flag.step)},${num(flag.value)}) {${latexEscape(flagText(flag))}};`);
  }
  const label = fileStem(chart.metric).toLowerCase();
  out.push("    \\end{axis}", "  \\end{tikzpicture}",
    `  \\caption{${latexEscape(chart.metric)}}`, `  \\label{fig:${label}}`, "\\end{figure}");
  return out.join("\n") + "\n";
}

const EXPORTS = {
  SVG: chart => download(new Blob([toSVG(paperScene(chart))], { type: "image/svg+xml" }), fileStem(chart.metric) + ".svg"),
  PNG: chart => {

    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.fillStyle = PAPER.surface;

  },
  PDF: chart => download(new Blob([toPDF(paperScene(chart))], { type: "application/pdf" }), fileStem(chart.metric) + ".pdf"),
  CSV: chart => download(new Blob([toCSV(chart)], { type: "text/csv" }), fileStem(chart.metric) + ".csv"),

function renderCharts() {
  const content = $("content");
  const metrics = new Set();
  const list = selectedExperiments();
  for (const { exp } of list) for (const name of exp.series.keys()) metrics.add(name);
  const names = [...metrics].sort();
  const sections = new Map();
  for (const name of names) {
    if (isPinned(name)) continue;
    const section = sectionOf(name);
    if (!sections.has(section)) sections.set(section, []);
    sections.get(section).push(name);
  }
  const order = [...sections.keys()].sort((a, b) => !a - !b || a.localeCompare(b));   // "Other" goes last
  const blocks = order.map(section => [section || "Other", sections.get(section)]);
  const pinned = names.filter(isPinned);
  if (pinned.length) blocks.unshift(["Pinned", pinned]);
  const signature = JSON.stringify(blocks);

  if (signature !== renderCharts.signature || !content.querySelector(".charts")) {
    renderCharts.signature = signature;
    content.replaceChildren();
    if (!names.length) {
      content.append(el("div", "empty", list.length ? "No scalars logged yet." : "Select experiments on the left to compare them."));
      charts.clear();
      return;
    }
    $("sections").replaceChildren(...order.filter(Boolean).map(section => {
      const option = el("option");
      option.value = section;
      return option;
    }));
    for (const [heading, members] of blocks) {
      if (blocks.length > 1 || heading !== "Other") content.append(el("h2", "", heading));
      const grid = el("div", "charts");
      for (const name of members) {
        const chart = charts.get(name) ?? makeChart(name);
        charts.set(name, chart);
        if (chart.pinTool) chart.pinTool.textContent = isPinned(name) ? "Unpin" : "Pin";
        grid.append(chart.card);
      }
      content.append(grid);
    }
    for (const name of [...charts.keys()]) if (!metrics.has(name)) charts.delete(name);
  }
  drawAll();
}

/* ---------- images ---------- */
function renderImages() {
  const content = $("content");
  const list = selectedExperiments();
  const names = new Map();
  for (const { exp, slot } of list) for (const image of exp.images) {
    if (!names.has(image.name)) names.set(image.name, []);
    names.get(image.name).push({ exp, slot, image });
  }
  const scroll = $("main").scrollTop;
  content.replaceChildren();
  if (!names.size) {
    content.append(el("div", "empty", list.length ? "No images logged yet." : "Select experiments on the left to compare them."));
    return;
  }
  const ordered = [...names.keys()].sort().sort((a, b) => isPinned(b) - isPinned(a));
  for (const name of ordered) {
    const entries = names.get(name);
    const steps = [...new Set(entries.map(item => item.image.step))].sort((a, b) => a - b);
    state.imageStep ??= {};
    const follow = state.imageStep[name] === undefined;
    const index = follow ? steps.length - 1 : Math.min(state.imageStep[name], steps.length - 1);
    const step = steps[index];

    const heading = el("h2", "imagehead", name);
    if (!EXPORT) {
      const pin = el("button", "tool", isPinned(name) ? "Unpin" : "Pin");
      pin.setAttribute("aria-label", (isPinned(name) ? "Unpin " : "Pin ") + name);
      pin.onclick = () => togglePin(name);
      heading.append(pin);
    }
    content.append(heading);
    const scrub = el("div", "scrub");
    const slider = el("input");
    slider.type = "range"; slider.min = 0; slider.max = steps.length - 1; slider.value = index;
    slider.setAttribute("aria-label", "Step for " + name);
    const label = el("span", "", "Step " + step);
    scrub.append(slider, label);
    content.append(scrub);

    const grid = el("div", "images");
    const paint = current => {
      grid.replaceChildren();
      for (const { exp, slot } of list) {
        const mine = entries.filter(item => item.exp === exp).map(item => item.image);
        if (!mine.length) continue;
        // Experiments can log images at different steps, so use the closest one.
        const image = mine.reduce((a, b) => Math.abs(b.step - current) < Math.abs(a.step - current) ? b : a);
        const figure = el("figure");
        const caption = el("figcaption");
        caption.append(lineKey(slot), document.createTextNode(labelOf(exp) + " · step " + image.step));
        const img = el("img");
        img.loading = "lazy";
        img.alt = name + " at step " + image.step + " from " + labelOf(exp);
        img.src = image.data ?? "/file?" + query(exp) + "&p=" + encodeURIComponent(image.path);
        figure.append(caption, img);
        grid.append(figure);
      }
    };
    slider.oninput = () => {
      const i = +slider.value;
      state.imageStep[name] = i === steps.length - 1 ? undefined : i;
      label.textContent = "Step " + steps[i];
      paint(steps[i]);
    };
    paint(step);
    content.append(grid);
  }
  $("main").scrollTop = scroll;
}

/* ---------- table ---------- */
function flatten(value, prefix, out) {
  if (value && typeof value === "object" && !Array.isArray(value)) {
    for (const [key, inner] of Object.entries(value)) flatten(inner, prefix ? prefix + "." + key : key, out);
  } else out[prefix] = typeof value === "string" ? value : JSON.stringify(value);
  return out;
}
function makeTable(title, headers, rows) {
  const content = $("content");
  content.append(el("h2", "", title));
  const wrap = el("div", "tablewrap");
  const table = el("table");
  const head = el("tr");
  head.append(el("th", "", ""));
  for (const header of headers) head.append(el("th", "", header));
  const thead = el("thead");
  thead.append(head);
  const body = el("tbody");
  for (const row of rows) {
    const tr = el("tr");
    tr.append(el("td", "", row.name));
    for (const cell of row.cells) tr.append(el("td", "num", cell));
    body.append(tr);
  }
  table.append(thead, body);
  wrap.append(table);
  content.append(wrap);
}
function renderTable() {
  const content = $("content");
  const list = selectedExperiments();
  const scroll = $("main").scrollTop;
  content.replaceChildren();
  if (!list.length) {
    content.append(el("div", "empty", "Select experiments on the left to compare them."));
    return;
  }
  const items = displayItems();
  const metrics = [...new Set(list.flatMap(({ exp }) => [...exp.series.keys()]))].sort();
  const latest = (item, metric) => {
    const s = seriesFor(metric).find(series => series.id === item.id);
    const ys = s ? s.raw ?? s.ys : [];
    for (let i = ys.length - 1; i >= 0; i--) {
      if (Number.isFinite(ys[i])) return s.std ? fmt(ys[i]) + " ± " + fmt(s.std[i]) : fmt(ys[i]);
    }
    return "–";
  };
  if (metrics.length) makeTable("Latest values", items.map(item => item.label), metrics.map(name => ({ name, cells: items.map(item => latest(item, name)) })));
  else content.append(el("div", "empty", "No scalars logged yet."));
  $("main").scrollTop = scroll;
}

/* ---------- hyperparameters ---------- */
function compareCells(a, b) {
  const x = Number(a), y = Number(b);
  if (a !== "" && b !== "" && !Number.isNaN(x) && !Number.isNaN(y)) return x - y;
  return a.localeCompare(b, undefined, { numeric: true });
}
function renderHyper() {
  const content = $("content");
  const list = selectedExperiments();
  const rows = list.map(({ exp, slot }) => ({ exp, slot, config: flatten(exp.config ?? {}, "", {}) }));
  const keys = [...new Set(rows.flatMap(row => Object.keys(row.config)))].filter(Boolean).sort();
  const varies = new Set(keys.filter(key => new Set(rows.map(row => row.config[key])).size > 1));
  const columns = keys.filter(key => varies.has(key));
  if (!state.hyperDiffOnly) columns.push(...keys.filter(key => !varies.has(key)));

  const sort = state.hyperSort;
  if (sort && columns.includes(sort.key)) {
    rows.sort((a, b) => {
      const x = a.config[sort.key], y = b.config[sort.key];
      if (x === undefined || y === undefined) return (x === undefined) - (y === undefined);   // blanks stay last
      return sort.direction * compareCells(x, y);
    });
  }

  // Polling redraws often during training, and rebuilding would lose the scroll position.
  const signature = JSON.stringify([rows.map(row => [row.exp.id, row.slot, row.config]), columns, sort, state.hyperDiffOnly]);
  if (signature === renderHyper.signature) return;
  renderHyper.signature = signature;

  const focused = document.activeElement?.dataset?.focus;
  const scrollX = content.querySelector(".tablewrap")?.scrollLeft ?? 0;
  content.replaceChildren();
  if (!list.length) {
    content.append(el("div", "empty", "Select experiments on the left to compare them."));
    return;
  }
  if (!keys.length) {
    content.append(el("div", "empty", "No hyperparameters logged yet. Pass config={...} to ALAG."));
    return;
  }

  const head = el("div", "hyperhead");
  head.append(el("h2", "", "Hyperparameters"));
  const filter = el("label", "control");
  const only = el("input");
  only.type = "checkbox";
  only.checked = state.hyperDiffOnly;
  only.dataset.focus = "only";
  only.onchange = () => {
    state.hyperDiffOnly = only.checked;
    save("alag.hyperDiffOnly", only.checked);
    renderHyper();
  };
  filter.append(only, document.createTextNode("Only settings that differ"));
  head.append(filter);
  content.append(head);
  if (!columns.length) {
    content.append(el("div", "empty", "Every setting is the same in the selected experiments."));
    return;
  }

  const table = el("table", "hyper");
  const titles = el("tr");
  titles.append(el("th", "", "Experiment"));
  for (const key of columns) {
    const th = el("th", varies.has(key) ? "varies" : "");
    th.scope = "col";
    const sorted = sort?.key === key;
    if (sorted) th.setAttribute("aria-sort", sort.direction > 0 ? "ascending" : "descending");
    const button = el("button", "sort", key + (sorted ? (sort.direction > 0 ? " ↑" : " ↓") : ""));
    button.dataset.focus = "sort:" + key;
    button.onclick = () => {
      state.hyperSort = { key, direction: sorted ? -sort.direction : 1 };
      renderHyper();
    };
    th.append(button);
    titles.append(th);
  }
  const thead = el("thead");
  thead.append(titles);
  const body = el("tbody");
  for (const { exp, slot, config } of rows) {
    const tr = el("tr");
    const name = el("td");
    name.append(lineKey(slot), document.createTextNode(labelOf(exp)));
    tr.append(name);
    for (const key of columns) {
      const cell = el("td", "num", config[key] ?? "–");
      if (config[key] !== undefined) cell.title = config[key];
      tr.append(cell);
    }
    body.append(tr);
  }
  table.append(thead, body);
  const wrap = el("div", "tablewrap");
  wrap.append(table);
  content.append(wrap);
  wrap.scrollLeft = scrollX;
  if (focused) content.querySelector(`[data-focus="${CSS.escape(focused)}"]`)?.focus();
}

/* ---------- notes ---------- */
function renderNotes() {
  const content = $("content");
  const list = selectedExperiments();
  content.replaceChildren();
  if (!list.length) {
    content.append(el("div", "empty", "Select experiments on the left to add notes and tags."));
    return;
  }
  for (const { exp, slot } of list) {
    const card = el("section", "notecard");
    const title = el("h3");
    title.append(lineKey(slot), document.createTextNode(exp.id));
    const meta = state.meta.get(exp.id) ?? {};
    const tags = el("input");
    tags.value = (meta.tags ?? []).join(", ");
    tags.placeholder = "baseline, diverged";
    const note = el("textarea");
    note.value = meta.note ?? "";
    tags.readOnly = note.readOnly = !!EXPORT;
    const tagLabel = el("label", "", "Tags, separated by commas");
    tagLabel.append(tags);
    const noteLabel = el("label", "", "Note");
    noteLabel.append(note);
    const store = async () => {
      const next = {
        ...(state.meta.get(exp.id) ?? {}),
        tags: [...new Set(tags.value.split(",").map(tag => tag.trim()).filter(Boolean))],
        note: note.value,
      };
      state.meta.set(exp.id, next);
      await post("/api/meta?" + query(exp), next);
      renderTree();
    };
    tags.onchange = store;
    note.onchange = store;
    card.append(title, tagLabel, noteLabel);
    if (!EXPORT) card.append(makeTrashButton(exp));
    content.append(card);
  }
}

// Moves a finished run to <logdir>/.trash. It takes two clicks, since a run can
// hold hours of training, and the server keeps the files so it can be undone.
function makeTrashButton(exp) {
  const row = el("div", "actions");
  const button = el("button", "", "Move to trash");
  const status = el("span", "", "");
  status.setAttribute("role", "status");
  const item = state.tree.groups.find(g => g.name === exp.g)?.experiments.find(e => e.name === exp.e);
  if (item && item.age < LIVE_SECONDS) {
    button.disabled = true;
    status.textContent = "Still logging. Runs can be moved to trash once they stop.";
  }
  let timer = null;
  button.onclick = async () => {
    if (!button.classList.contains("armed")) {
      button.classList.add("armed");
      button.textContent = "Click again to move " + exp.e + " to trash";
      timer = setTimeout(() => { button.classList.remove("armed"); button.textContent = "Move to trash"; }, 4000);
      return;
    }
    clearTimeout(timer);
    button.disabled = true;
    const response = await post("/api/trash?" + query(exp), {}).catch(() => null);
    if (!response?.ok) {
      button.disabled = false;
      button.classList.remove("armed");
      button.textContent = "Move to trash";
      status.textContent = response?.status === 409
        ? "Couldn't move it: the run is still logging, or a file in it is open."
        : "Couldn't move it to trash.";
      return;
    }
    setSelected(exp.id, false);
    experiments.delete(exp.id);
    state.meta.delete(exp.id);
    for (const group of state.tree.groups) group.experiments = group.experiments.filter(e => idOf(group.name, e.name) !== exp.id);
    refresh();
  };
  row.append(button, status);
  return row;
}

/* ---------- wiring ---------- */
function render() {
  renderLegend();
  if (state.tab === "charts") renderCharts();
  else if (state.tab === "images") renderImages();
  else if (state.tab === "table") renderTable();
  else if (state.tab === "hyper") renderHyper();
  else if (!$("content").contains(document.activeElement)) renderNotes();   // don't wipe text being typed
}
for (const button of document.querySelectorAll("#tabs button")) {
  button.onclick = () => {
    state.tab = button.dataset.tab;
    for (const other of document.querySelectorAll("#tabs button")) other.setAttribute("aria-selected", other === button);
    renderCharts.signature = renderHyper.signature = null;
    $("content").replaceChildren();
    render();
    poll();
  };
}
$("filter").oninput = event => { state.filter = event.target.value; renderTree(); };
$("smooth").oninput = event => {
  state.smooth = +event.target.value;
  state.version++;
  $("smoothval").textContent = event.target.value;
  drawAll();
};
$("xaxis").onchange = event => { state.xaxis = event.target.value; state.version++; setZoom(null); };
$("aggregate").onchange = event => {
  state.aggregate = event.target.checked;
  if (state.aggregate) { state.xaxis = "step"; $("xaxis").value = "step"; }   // seeds line up by step, not by clock
  $("xaxis").disabled = state.aggregate;
  state.version++;
  render();
};
$("copy").onclick = async () => {
  const code = $("latexcode");
  try {
    await navigator.clipboard.writeText(code.value);
    $("copied").textContent = "Copied";
  } catch {
    code.select();
    $("copied").textContent = "Press Ctrl+C to copy";
  }
};
$("closelatex").onclick = () => $("latex").close();
$("logy").onchange = event => { state.logy = event.target.checked; drawAll(); };
$("reset").onclick = () => setZoom(null);
addEventListener("resize", drawAll);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readTheme(); state.version++; renderTree(); render(); });

readTheme();
render();
poll();
if (EXPORT) {
  $("exported").hidden = false;
  $("exported").textContent = "Read-only export, " + new Date(EXPORT.exported * 1000).toLocaleString();
} else setInterval(poll, POLL_MS);
</script>
