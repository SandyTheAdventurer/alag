[package]
name = "alag"
version = "0.1.0"
edition = "2021"
description = "A simple logging and graphing tool for researchers"
license = "MIT"
repository = "https://github.com/SandyTheAdventurer/alag"

[[bin]]
name = "alag"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
